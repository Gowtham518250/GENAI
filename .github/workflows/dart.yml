name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        # Keep compiler/analyzer errors fatal for deployment safety.
        # The repository currently has a large legacy warning backlog; warnings
        # are surfaced in CI output but do not block the deployment gate.
        run: flutter analyze --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test
